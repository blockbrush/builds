name: Index
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every info.json
        run: node scripts/build-index.js --check
      - name: Write index.json
        if: github.event_name == 'push'
        run: |
          node scripts/build-index.js
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update index.json" index.json
            git push
          fi
      # the website (builds.blockbrush.app): a gallery and a page per build, made from the folders
      - name: Make the website
        run: node scripts/build-site.js
      - name: Upload the website
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name == 'push'
    needs: index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
